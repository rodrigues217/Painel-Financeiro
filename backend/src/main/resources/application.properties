# Perfil padrão: MySQL local
spring.application.name=painel-financeiro-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/painel_financeiro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
